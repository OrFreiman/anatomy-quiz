<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול אנטומיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow study column (phone-first), a sticky score bar on top, cards stacked with gap. */
:root{
  --bg:#edf1f4; --surface:#ffffff; --ink:#15222d; --muted:#5a6a77; --line:#d6dee5;
  --accent:#1d5c8f; --accent-soft:#dde9f4; --gold:#c98a12; --gold-soft:#fbefd6;
  --good:#1d8a4f; --good-soft:#dcf3e5; --bad:#c43838; --bad-soft:#fbe2e2;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#172129; --ink:#e6edf2; --muted:#97a7b3; --line:#2a3743;
  --accent:#6eaee3; --accent-soft:#1c3346; --gold:#f0b440; --gold-soft:#3a2f17;
  --good:#45c47f; --good-soft:#163526; --bad:#f06a6a; --bad-soft:#3d1c1c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#172129; --ink:#e6edf2; --muted:#97a7b3; --line:#2a3743;
  --accent:#6eaee3; --accent-soft:#1c3346; --gold:#f0b440; --gold-soft:#3a2f17;
  --good:#45c47f; --good-soft:#163526; --bad:#f06a6a; --bad-soft:#3d1c1c; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;flex:1;background:none;border:0;padding:0;text-align:right}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.pts{background:var(--gold-soft);color:var(--gold)}
.chip.day{background:var(--accent-soft);color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:13px 16px;font-weight:700;font-size:17px;min-height:50px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1418}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1418}}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{font-weight:400;opacity:.85}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero h1{font-size:26px}
.hero p{margin:6px 0 16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sect h2{font-size:19px}
.topics{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:none;border:0;border-radius:10px;padding:9px 8px;text-align:right;width:100%}
.topic:hover{background:var(--bg)}
.topic .nm{font-weight:600}
.topic .nm small{color:var(--muted);font-weight:400}
.topic .pc{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--good)}
.bar .s{background:var(--accent);opacity:.35}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-top:14px}
.qhead .count{font-weight:700;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.pbar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.pbar i{height:100%}.pbar i.ok{background:var(--good)}.pbar i.no{background:var(--bad)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--accent)}
.xbtn{background:none;border:0;color:var(--muted);font-size:15px;padding:6px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px}
.qtext{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.45;margin:10px 0 0}
.qimg{margin-top:12px;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line)}
.qimg img{display:block;max-width:100%;margin:0 auto;max-height:340px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:54px;width:100%;font-size:17px;transition:border-color .15s,background .15s}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:15px}
.opt .t{padding-top:1px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{border-radius:var(--r);padding:16px;border:2px solid}
.fb.ok{border-color:var(--good);background:var(--good-soft)}
.fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb h3 .gain{font-size:15px;color:var(--gold);background:var(--surface);border-radius:99px;padding:2px 10px}
.fb p{margin:8px 0 0}
.ref{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--ink) 15%,transparent);flex-wrap:wrap}
.ref b{font-variant-numeric:tabular-nums}
.linkbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600;font-size:15px}
.slide{margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.slide img{display:block;width:100%}
/* result */
.score{text-align:center}
.score .big{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:26px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rv{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv .mk{font-weight:700}
.rv .mk.ok{color:var(--good)} .rv .mk.no{color:var(--bad)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px}
.badge .ic{width:40px;height:40px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.badge .ic svg{width:22px;height:22px}
.badge b{display:block;font-size:15px}
.badge.lock{opacity:.45}
.badge.lock .ic{background:var(--line);color:var(--muted)}
.badge.new{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;z-index:9;max-width:90vw;text-align:center}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
@media (max-width:340px){.kpis{grid-template-columns:repeat(2,1fr)}}@media (max-width:400px){.qtext{font-size:19px}.hero h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
.start{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.tog input{width:18px;height:18px}
.bq{padding:14px}
.bqh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.st{margin-inline-start:auto;font-weight:600;color:var(--muted)}
.st.ok{color:var(--good)} .st.no{color:var(--bad)}
.bqt{font-weight:700;margin:8px 0 0}
.bo{margin:8px 0 0;padding-inline-start:22px;font-size:15px}
.bo li{padding:2px 6px;border-radius:6px}
.bo li.right{background:var(--good-soft);color:var(--good);font-weight:700}
.be{font-size:14px;color:var(--muted);margin:8px 0 10px}
</style>
</head>
<body>
<div class="top"><div class="in">
  <button class="brand" id="homeBtn" type="button">תרגול אנטומיה<small>מערכת שריר-שלד · שקופיות 1–132 · מונחים</small></button>
  <span class="chip day" id="dayChip" title="ימים ברצף"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 7.5A2.5 2.5 0 0 0 13 12c1.6 0 2.5-1.3 2.4-3 2 1.6 3.6 4 3.6 6.7A7 7 0 0 1 5 15.7C5 11 9.5 8.6 12 2z"/></svg><span id="dayN">0</span></span>
  <span class="chip pts" id="ptsChip" title="נקודות"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg><span id="ptsN">0</span></span>
</div></div>
<main class="wrap" id="app"></main>
<script>
const QUESTIONS = [{"id": 1, "s": 11, "t": "org", "q": "מה פירוש המילה \"אנטומיה\" (Anatomy) לפי מקורה?", "o": ["להפריד/לפרק ולחתוך (Ana + Tome)", "לחקור את תפקוד האיברים", "תורת התנועה של הגוף", "מדע התאים והרקמות"], "e": "Ana – להפריד/לפרק, Tome – חיתוך. אנטומיה היא התחום שחוקר את המבנה והצורה של איברי הגוף."}, {"id": 2, "s": 11, "t": "org", "q": "אנטומיה (Anatomy) היא התחום בביולוגיה שחוקר את:", "o": ["המבנה והצורה של איברי הגוף", "התהליכים הכימיים בתא", "תורת התנועה בלבד", "התגובה של הגוף לאימון"], "e": "לפי ההגדרה במצגת: תחום בביולוגיה שחוקר את המבנה והצורה של איברי הגוף."}, {"id": 3, "s": 13, "t": "org", "q": "מהו הסדר הנכון של רמות הארגון בגוף, מהקטנה לגדולה?", "o": ["כימית ← אברון ← תא ← רקמה ← איבר ← מערכת ← אורגניזם", "תא ← אברון ← כימית ← רקמה ← איבר ← מערכת ← אורגניזם", "כימית ← תא ← אברון ← איבר ← רקמה ← מערכת ← אורגניזם", "אברון ← כימית ← תא ← רקמה ← מערכת ← איבר ← אורגניזם"], "e": "שבע רמות הארגון: רמה כימית, אברון (Organelle), תא (Cell), רקמה (Tissue), איבר, מערכת, אורגניזם שלם."}, {"id": 4, "s": 14, "t": "org", "q": "כמה רמות ארגון יש בגוף החי לפי המצגת?", "o": ["7", "5", "4", "9"], "e": "שבע רמות: כימית, אברון, תא, רקמה, איבר, מערכת ואורגניזם שלם."}, {"id": 5, "s": 14, "t": "org", "q": "\"קבוצת תאים הדומים במבנה ובתפקיד ופועלים יחד\" – לאיזו רמת ארגון מתאים התיאור?", "o": ["רקמה (Tissue)", "איבר (Organ)", "מערכת (System)", "אברון (Organelle)"], "e": "זו ההגדרה של רקמה – רמה 4 ברמות הארגון."}, {"id": 6, "s": 14, "t": "org", "q": "הלב, הכבד והמוח הם דוגמאות לאיזו רמת ארגון?", "o": ["איבר (Organ)", "רקמה (Tissue)", "מערכת (System)", "תא (Cell)"], "e": "איבר – כמה רקמות שמצטרפות למבנה אחד בעל תפקיד בתוך מערכת: לב, כבד, מוח."}, {"id": 7, "s": 14, "t": "org", "q": "הכליה (Kidney) בנויה מכמה סוגי רקמות שפועלות יחד לתפקיד אחד. לאיזו רמת ארגון היא שייכת?", "o": ["איבר (Organ)", "רקמה (Tissue)", "אברון (Organelle)", "אורגניזם שלם"], "e": "בדומה ללב ולכבד במצגת – כמה רקמות במבנה אחד בעל תפקיד = איבר."}, {"id": 8, "s": 14, "t": "org", "q": "\"הלב וכלי הדם\" יחד הם דוגמה לרמת ארגון של:", "o": ["מערכת (System)", "איבר (Organ)", "רקמה (Tissue)", "אורגניזם שלם"], "e": "מערכת – איברים שחוברים יחד למשימה משותפת, כמו מערכת הנשימה או הלב וכלי הדם."}, {"id": 9, "s": 15, "t": "org", "q": "מהי \"יחידת החיים הבסיסית ביותר, מבנית ותפקודית\"?", "o": ["התא (Cell)", "האברון (Organelle)", "הרקמה (Tissue)", "המולקולה"], "e": "התא הוא יחידת החיים הבסיסית ביותר של כל יצור חי, ובתוכו אברונים רבים."}, {"id": 10, "s": 14, "t": "org", "q": "ברמה הכימית של הארגון:", "o": ["אטומים נקשרים ויוצרים מולקולות", "תאים דומים מתארגנים יחד לרקמות", "אברונים מתארגנים ויוצרים תא", "איברים חוברים יחד למערכת"], "e": "רמה 1 – רמה כימית: אטומים נקשרים ויוצרים מולקולות."}, {"id": 11, "s": 16, "t": "org", "q": "איזו טענה נכונה לגבי התאים בגוף?", "o": ["כל התאים חולקים מרכיבים דומים אך נראים שונה ותפקידם שונה", "כל התאים זהים לחלוטין בצורתם ובתפקידם", "לכל סוג תא אברונים שונים לגמרי ללא מרכיבים משותפים", "רק לתאי השריר יש אברונים"], "e": "\"הרכב דומה, צורה שונה\" – כל התאים חולקים מרכיבים דומים, אך נראים אחרת ותפקידם שונה."}, {"id": 12, "s": 19, "t": "org", "q": "איזה אברון מפיק אנרגיה לתא בתהליך שדורש חמצן?", "o": ["מיטוכונדריה (Mitochondria)", "ריבוזום (Ribosome)", "ליזוזום (Lysosome)", "גולג'י (Golgi)"], "e": "המיטוכונדריה מפיקה אנרגיה לתא בתהליך שדורש חמצן."}, {"id": 13, "s": 19, "t": "org", "q": "מה תפקיד הריבוזומים (Ribosomes)?", "o": ["האתר שבו מורכבים החלבונים – סינתזה", "פירוק חומרי פסולת וגופים זרים", "הפקת אנרגיה", "ברירת מה נכנס ויוצא מהתא"], "e": "הריבוזומים הם האתר שבו מורכבים (מסונתזים) החלבונים."}, {"id": 14, "s": 19, "t": "org", "q": "איזה אברון מפרק בתוך התא חומרי פסולת וגופים זרים?", "o": ["ליזוזום (Lysosome)", "גרעין (Nucleus)", "מיטוכונדריה (Mitochondria)", "ריבוזום (Ribosome)"], "e": "הליזוזום מפרק בתוך התא חומרי פסולת וגופים זרים."}, {"id": 15, "s": 19, "t": "org", "q": "מה תפקיד מנגנון הגולג'י (Golgi apparatus)?", "o": ["מעבד, ממיין ואורז חלבונים ושומנים", "מכיל ושומר את החומר התורשתי של התא", "מפיק אנרגיה לתא בתהליך שדורש חמצן", "מפרק חומר  56, "t": "bone", "q": "מהי הדיאפיזה (Diaphysis)?", "o": ["גוף העצם – החלק המרכזי, עשוי עצם צפופה", "קצוות העצם, עשויים עצם ספוגית", "האזור הסחוסי שממנו העצם מתארכת", "החלל המרכזי של העצם"], "e": "הדיאפיזה היא גוף העצם – החלק המרכזי, עשוי רקמת עצם צפופה."}, {"id": 96, "s": 56, "t": "bone", "q": "מהי האפיפיזה (Epiphysis)?", "o": ["קצוות העצם – עשויים עצם ספוגית", "גוף העצם המרכזי – עשוי עצם צפופה", "שכבת הסחוס שעוטפת את קצוות העצם", "החלל המרכזי שבו נמצא מח העצם"], "e": "האפיפיזה היא קצוות העצם, עשויה רקמת עצם ספוגית ופחות עמידה."}, {"id": 97, "s": 56, "t": "bone", "q": "מהי לוחית הצמיחה (Epiphyseal plate)?", "o": ["אזור סחוסי שממנו העצם מתארכת – עד שמתגרם", "שכבת סחוס שעוטפת את קצוות העצם", "החלל שבו נמצא מח העצם", "שכבת העצם הצפופה החיצונית"], "e": "לוחית הצמיחה היא אזור סחוסי שממנו העצם מתארכת; כשהיא מתגרמת – תהליך הגדילה מפסיק."}, {"id": 98, "s": 56, "t": "bone", "q": "מה ממלא את החלל המרכזי של העצם הארוכה?", "o": ["מח העצם (Marrow)", "נוזל סינוביאלי", "סחוס היאליני", "עצם ספוגית בלבד"], "e": "מח העצם (Marrow) ממלא את החלל המרכזי של העצם."}, {"id": 99, "s": 56, "t": "bone", "q": "כל הבאים הם חלקים במבנה העצם הארוכה, חוץ מ:", "o": ["פסיקולה (Fascicle)", "דיאפיזה (Diaphysis)", "אפיפיזה (Epiphysis)", "לוחית צמיחה (Epiphyseal plate)"], "e": "פסיקולה היא צרור של סיבי שריר. חלקי העצם: דיאפיזה, אפיפיזה, סחוס מפרקי, מח עצם ולוחית צמיחה."}, {"id": 100, "s": 56, "t": "bone", "q": "נער בן 14 עדיין גדל לגובה. איזה מבנה בעצמות הארוכות שלו עדיין פתוח ומאפשר זאת?", "o": ["לוחית הצמיחה (Epiphyseal plate)", "הסחוס המפרקי (Articular cartilage)", "מח העצם (Marrow)", "הדיאפיזה (Diaphysis)"], "e": "לוחית הצמיחה היא אזור סחוסי שממנו העצם מתארכת – עד שהיא מתגרמת."}, {"id": 101, "s": 58, "t": "bone", "q": "כל עצם מורכבת משני סוגי רקמות עצם:", "o": ["עצם ספוגית ועצם צפופה", "עצם ארוכה ועצם קצרה", "עצם היאלינית ועצם פיברוטית", "עצם צירית ועצם היקפית"], "e": "כל עצם מורכבת מעצם ספוגית (Spongy bone) – בפנים האפיפיזה, ועצם צפופה (Compact bone) – המעטפת."}, {"id": 102, "s": 59, "t": "bone", "q": "איזה אחוז ממשקל השלד מהווה העצם הספוגית (Spongy bone)?", "o": ["כ-20%", "כ-80%", "כ-50%", "כ-5%"], "e": "העצם הספוגית מהווה כ-20% ממשקל השלד, והעצם הצפופה כ-80%."}, {"id": 103, "s": 61, "t": "bone", "q": "איזה אחוז ממשקל השלד מהווה העצם הצפופה (Compact bone)?", "o": ["כ-80%", "כ-20%", "כ-50%", "כ-95%"], "e": "העצם הצפופה מהווה כ-80% ממשקל השלד."}, {"id": 104, "s": 59, "t": "bone", "q": "כל הבאים נכונים לגבי העצם הספוגית (Spongy bone), חוץ מ:", "o": ["היא מהווה את המעטפת החיצונית של העצם", "היא ממלאת את החלק הפנימי של קצות העצם", "היא מסתגלת לעומסים בכיוונים שונים", "אצל נשים היא צפופה פחות מסיבות גנטיות"], "e": "המעטפת החיצונית היא העצם הצפופה. העצם הספוגית ממלאת את פנים קצות העצם."}, {"id": 105, "s": 59, "t": "bone", "q": "לפי המצגת, מדוע העצם הספוגית אצל נשים צפופה פחות?", "o": ["מסיבות גנטיות", "בגלל חוסר בפעילות גופנית בלבד", "בגלל תזונה", "היא לא צפופה פחות"], "e": "לפי המצגת – אצל נשים העצם הספוגית צפופה פחות מסיבות גנטיות."}, {"id": 106, "s": 60, "t": "bone", "q": "איזה סוג רקמת עצם רואים בתמונה?", "o": ["עצם ספוגית (Spongy bone)", "עצם צפופה (Compact bone)", "סחוס היאליני (Hyaline cartilage)", "סחוס פיברוטי (Fibrocartilage)"], "e": "המבנה הנקבובי דמוי הרשת הוא עצם ספוגית – שמסתגלת לעומסים בכיוונים שונים.", "img": "q60"}, {"id": 107, "s": 61, "t": "bone", "q": "מה עובר בתעלות החלולות שבתוך העצם הצפופה (Compact bone)?", "o": ["כלי דם ועצבים", "נוזל סינוביאלי", "סיבי שריר", "מח עצם צהוב בלבד"], "e": "בתוך העצם הצפופה יש תעלות חלולות שבהן עוברים כלי דם ועצבים."}, {"id": 108, "s": 62, "t": "bone", "q": "מה התפקיד העיקרי של העצמות הארוכות (Long bones)?", "o": ["מנוף לתנועה", "הגנה על איברים", "בלימת זעזועים", "ייצור סידן"], "e": "עצמות ארוכות משמשות מנוף לתנועה – בזרוע, באמה, באצבעות, בירך ובשוק."}, {"id": 109, "s": 62, "t": "bone", "q": "מה התפקיד העיקרי של העצמות השטוחות (Flat bones)?", "o": ["תפקיד הגנתי", "מנוף לתנועה", "בלימת זעזועים בין חוליות", "הגדלת כוח הגיד"], "e": "לעצמות השטוחות תפקיד הגנתי: אגן, שכמה, צלעות, גולגולת ועצם החזה."}, {"id": 110, "s": 62, "t": "bone", "q": "כל הבאות הן עצמות שטוחות (Flat bones), חוץ מ:", "o": ["עצם הירך (Femur)", "השכמה (Scapula)", "עצם החזה (Sternum)", "הגולגולת (Skull)"], "e": "עצם הירך היא עצם ארוכה. העצמות השטוחות: אגן, שכמה, צלעות, גולגולת ועצם החזה."}, {"id": 111, "s": 62, "t": "bone", "q": "היכן נמצאות העצמות הקצרות (Short bones)?", "o": ["בשורש כף היד ובשורש כף הרגל", "בזרוע, באמה ובירך", "בחוליות עמוד השדרה", "בגולגולת ובאגן"], "e": "עצמות קצרות נמצאות בשורש כף היד ובכף הרגל."}, {"id": 112, "s": 62, "t": "bone", "q": "חוליות עמוד השדרה ועצמות הפנים הן דוגמה ל:", "o": ["עצמות חסרות צורה (Irregular bones)", "עצמות שטוחות (Flat bones)", "עצמות קצרות (Short bones)", "עצמות ססמואידיות (Sesamoid bones)"], "e": "עצמות חסרות צורה – ללא צורה אופיינית: חוליות עמוד השדרה ועצמות הפנים."}, {"id": 113, "s": 62, "t": "bone", "q": "מהי עצם ססמואידית (Sesamoid bone)?", "o": ["עצם שיושבת בתוך גיד – למשל פיקת הברך", "עצם קצרה בשורש כף היד", "עצם שטוחה שמגינה על איברים", "עצם ללא צורה אופיינית"], "e": "עצם ססמואידית יושבת בתוך גיד – הדוגמה במצגת: פיקת הברך (Patella)."}, {"id": 114, "s": 62, "t": "bone", "q": "פיקת הברך (Patella) היא דוגמה לעצם:", "o": ["ססמואידית (Sesamoid)", "שטוחה (Flat)", "ארוכה (Long)", "קצרה (Short)"], "e": "פיקת הברך היא עצם ססמואידית – עצם שיושבת בתוך גיד."}, {"id": 115, "s": 62, "t": "bone", "q": "עצם הסירה (Scaphoid) היא אחת מעצמות שורש כף היד. לאיזה סוג עצם היא שייכת?", "o": ["קצרה (Short bone)", "ארוכה (Long bone)", "שטוחה (Flat bone)", "ססמואידית (Sesamoid bone)"], "e": "עצמות שורש כף היד (Carpal bones) הן עצמות קצרות."}, {"id": 116, "s": 62, "t": "bone", "q": "עצם השוקה (Tibia) היא דוגמה לעצם:", "o": ["ארוכה – מנוף לתנועה", "שטוחה – הגנתית", "קצרה", "חסרת צורה"], "e": "עצמות ארוכות נמצאות בזרוע, באמה, באצבעות, בירך ובשוק ומשמשות מנוף לתנועה."}, {"id": 117, "s": 62, "t": "bone", "q": "הצלעות (Ribs) מגינות על הלב והריאות. לאיזה סוג עצם הן שייכות?", "o": ["שטוחות (Flat bones)", "ארוכות (Long bones)", "קצרות (Short bones)", "חסרות צורה (Irregular bones)"], "e": "הצלעות מופיעות במצגת ברשימת העצמות השטוחות שתפקידן הגנתי."}, {"id": 118, "s": 62, "t": "bone", "q": "עצמות האצבעות (Phalanges) הן עצמות:", "o": ["ארוכות", "קצרות", "ססמואידיות", "שטוחות"], "e": "לפי המצגת, עצמות ארוכות נמצאות בזרוע, באמה, באצבעות, בירך ובשוק."}, {"id": 119, "s": 64, "t": "bone", "q": "מה קורה בשלב הראשון של ההתגרמות התוך-סחוסית?", "o": ["בתקופה העוברית נוצר מודל סחוס בצורת השלד", "לוחיות הצמיחה נסגרות", "נוצר מרכז התגרמות באפיפיזות", "העצם מתארכת מהלוחית"], "e": "השלב הראשון: מודל סחוסי – בתקופה העוברית נוצר מודל סחוס בצורת השלד שעתיד להתגרם."}, {"id": 120, "s": 64, "t": "bone", "q": "היכן נוצר מרכז ההתגרמות הראשוני?", "o": ["באזור הדיאפיזה", "באפיפיזות", "בלוחית הצמיחה", "בסחוס המפרקי"], "e": "מרכז ההתגרמות הראשוני נוצר באזור הדיאפיזה (נוצר bone collar ואוסטאובלסטים מייצרים עצם)."}, {"id": 121, "s": 64, "t": "bone", "q": "היכן נוצר מרכז ההתגרמות המשני?", "o": ["באפיפיזות", "בדיאפיזה", "במח העצם", "בפריוסט"], "e": "מרכז התגרמות משני – תהליך דומה מתחיל גם באפיפיזות."}, {"id": 122, "s": 64, "t": "bone", "q": "מתי מסתיים תהליך ההתגרמות?", "o": ["כשלוחיות הצמיחה מתגרמות ונסגרות", "כשנוצר מרכז ההתגרמות הראשוני", "בלידה", "כשנוצר מודל הסחוס"], "e": "השלב האחרון – סגירת הלוחיות: משמתגרמות לוחיות הצמיחה, תהליך ההתגרמות הסתיים."}, {"id": 123, "s": 65, "t": "bone", "q": "מהו הסדר הנכון של שלבי ההתגרמות?", "o": ["מודל סחוסי ← מרכז ראשוני ← מרכז משני ← סגירת לוחיות", "מרכז ראשוני ← מודל סחוסי ← סגירת לוחיות ← מרכז משני", "מרכז משני ← מרכז ראשוני ← מודל סחוסי ← סגירת לוחיות", "מודל סחוסי ← מרכז משני ← מרכז ראשוני ← סגירת לוחיות"], "e": "סדר השלבים: מודל סחוסי, מרכז ראשוני (דיאפיזה), מרכז משני (אפיפיזות), סגירת לוחיות."}, {"id": 124, "s": 64, "t": "bone", "q": "בשלב מרכז ההתגרמות הראשוני, מה קורה לתאי הסחוס?", "o": ["הם מתנוונים, ואוסטאובלסטים מייצרים עצם", "הם הופכים לתאי שריר", "הם מתרבים ומאריכים את העצם", "הם הופכים לאוסטאוקלסטים"], "e": "במרכז הראשוני נוצר bone collar, אוסטאובלסטים מייצרים עצם ותאי הסחוס מתנוונים."}, {"id": 125, "s": 66, "t": "bone", "q": "בצ וחד לעייפות"], "e": "כל שרירי השלד בנויים משילוב של שלושת סוגי הסיבים, בהתאם לתפקידם."}, {"id": 161, "s": 80, "t": "mus", "q": "שרירי היציבה (למשל שרירי הגב) צריכים לעבוד כל היום בעצימות נמוכה. איזה סוג סיבים מתאים לתפקיד כזה?", "o": ["Type 1 – אדומים-איטיים", "Type 2B – לבנים-מהירים", "Type 2A – מעורבים", "אין הבדל"], "e": "שרירים שעובדים לאורך זמן בכוח נמוך נשענים בעיקר על סיבי Type 1."}, {"id": 162, "s": 82, "t": "terms", "q": "במנח האנטומי (Anatomical position), לאן פונות כפות הידיים?", "o": ["קדימה, האגודלים כלפי חוץ", "אחורה, האגודלים כלפי פנים", "אל הגוף", "כלפי מטה"], "e": "במנח האנטומי כפות הידיים פונות קדימה, והאגודלים כלפי חוץ."}, {"id": 163, "s": 82, "t": "terms", "q": "כל הבאים הם חלק מהמנח האנטומי, חוץ מ:", "o": ["הידיים מורמות מעל הראש", "עמידה זקופה ומבט לפנים", "הרגליים צמודות ומקבילות", "הבהונות פונות קדימה"], "e": "במנח האנטומי הידיים פשוטות לצידי הגוף, לא מורמות."}, {"id": 164, "s": 82, "t": "terms", "q": "מדוע משתמשים במנח אנטומי (Anatomical position)?", "o": ["כל תיאור של מיקום אנטומי מתייחס לתנוחה אחת מוסכמת", "כדי למדוד גובה", "כי זו התנוחה הנוחה ביותר לאימון", "כדי לבדוק גמישות"], "e": "כל תיאור של מיקום אנטומי מתייחס לתנוחה אחת מוסכמת – המנח האנטומי."}, {"id": 165, "s": 84, "t": "terms", "q": "הראש נמצא ______ לצוואר.", "o": ["סופריורי (Superior)", "אינפריורי (Inferior)", "פוסטריורי (Posterior)", "דיסטלי (Distal)"], "e": "Superior – גבוה יותר ביחס לאיבר אחר: הראש סופריורי לצוואר."}, {"id": 166, "s": 84, "t": "terms", "q": "הכתפיים נמצאות ביחס לאגן:", "o": ["סופריוריות (Superior)", "אינפריוריות (Inferior)", "מדיאליות (Medial)", "עמוקות (Deep)"], "e": "הכתפיים גבוהות יותר מהאגן – כלומר סופריוריות לו."}, {"id": 167, "s": 85, "t": "terms", "q": "עצם החזה (Sternum) נמצאת ביחס לעמוד השדרה:", "o": ["אנטריורית (Anterior)", "פוסטריורית (Posterior)", "לטרלית (Lateral)", "דיסטלית (Distal)"], "e": "Anterior – קרוב יותר לחזית הגוף. עצם החזה נמצאת לפני עמוד השדרה."}, {"id": 168, "s": 85, "t": "terms", "q": "השכמות (Scapulae) נמצאות ביחס לעצם החזה:", "o": ["פוסטריוריות (Posterior)", "אנטריוריות (Anterior)", "סופריוריות (Superior)", "שטחיות (Superficial)"], "e": "Posterior – קרוב יותר לגב. השכמות נמצאות מאחור, עצם החזה מלפנים."}, {"id": 169, "s": 86, "t": "terms", "q": "מהו המונח המתאר מיקום \"קרוב יותר לקו האמצע של הגוף\"?", "o": ["מדיאלי (Medial)", "לטרלי (Lateral)", "פרוקסימלי (Proximal)", "שטחי (Superficial)"], "e": "Medial – קרוב יותר לקו האמצע; Lateral – רחוק יותר מקו האמצע."}, {"id": 170, "s": 86, "t": "terms", "q": "האף נמצא ביחס לעיניים:", "o": ["מדיאלי (Medial)", "לטרלי (Lateral)", "דיסטלי (Distal)", "פוסטריורי (Posterior)"], "e": "האף נמצא על קו האמצע של הפנים, ולכן מדיאלי לעיניים."}, {"id": 171, "s": 86, "t": "terms", "q": "במנח האנטומי, האגודל נמצא ביחס לזרת:", "o": ["לטרלי (Lateral)", "מדיאלי (Medial)", "פרוקסימלי (Proximal)", "עמוק (Deep)"], "e": "במנח האנטומי האגודלים פונים החוצה – ולכן האגודל לטרלי לזרת (דוגמה מהמצגת)."}, {"id": 172, "s": 86, "t": "terms", "q": "האוזניים נמצאות ביחס לאף:", "o": ["לטרליות (Lateral)", "מדיאליות (Medial)", "אנטריוריות (Anterior)", "אינפריוריות (Inferior)"], "e": "האוזניים רחוקות יותר מקו האמצע – ולכן לטרליות לאף."}, {"id": 173, "s": 87, "t": "terms", "q": "המונחים פרוקסימלי ודיסטלי (Proximal / Distal) נמדדים ביחס ל:", "o": ["נקודת החיבור של הגפה לגוף", "קו האמצע של הגוף", "פני העור", "חזית הגוף"], "e": "שני המונחים נמדדים ביחס לנקודת החיבור של הגפה לגוף."}, {"id": 174, "s": 87, "t": "terms", "q": "שורש כף היד (Wrist) נמצא ביחס למרפק:", "o": ["דיסטלי (Distal)", "פרוקסימלי (Proximal)", "סופריורי (Superior)", "מדיאלי (Medial)"], "e": "שורש כף היד רחוק יותר מנקודת חיבור הגפה לגוף (הכתף) – ולכן דיסטלי למרפק."}, {"id": 175, "s": 87, "t": "terms", "q": "הברך נמצאת ביחס לקרסול:", "o": ["פרוקסימלית (Proximal)", "דיסטלית (Distal)", "לטרלית (Lateral)", "שטחית (Superficial)"], "e": "הברך קרובה יותר לחיבור הרגל לגוף (מפרק הירך) – ולכן פרוקסימלית לקרסול."}, {"id": 176, "s": 87, "t": "terms", "q": "עצם הירך (Femur) ביחס לעצם השוקה (Tibia) היא:", "o": ["פרוקסימלית (Proximal)", "דיסטלית (Distal)", "מדיאלית (Medial)", "עמוקה (Deep)"], "e": "עצם הירך פרוקסימלית לשוקה – דוגמה מהמצגת."}, {"id": 177, "s": 87, "t": "terms", "q": "קצות האצבעות ביחס לכף היד הם:", "o": ["דיסטליים (Distal)", "פרוקסימליים (Proximal)", "סופריוריים (Superior)", "מדיאליים (Medial)"], "e": "קצות האצבעות רחוקים יותר מחיבור הגפה לגוף – ולכן דיסטליים."}, {"id": 178, "s": 88, "t": "terms", "q": "העור נמצא ביחס לשרירים:", "o": ["שטחי (Superficial)", "עמוק (Deep)", "פרוקסימלי (Proximal)", "מדיאלי (Medial)"], "e": "Superficial – קרוב יותר לפני השטח, לעור."}, {"id": 179, "s": 88, "t": "terms", "q": "הלב נמצא ביחס לעצם החזה (Sternum):", "o": ["עמוק (Deep)", "שטחי (Superficial)", "דיסטלי (Distal)", "לטרלי (Lateral)"], "e": "Deep – פנימי יותר ביחס לפני השטח. הלב נמצא עמוק לעצם החזה."}, {"id": 180, "s": 88, "t": "terms", "q": "שריר הירך הקדמי ביחס לעצם הירך הוא:", "o": ["שטחי (Superficial)", "עמוק (Deep)", "דיסטלי (Distal)", "אינפריורי (Inferior)"], "e": "דוגמה מהמצגת: שריר הירך הקדמי שטחי לעצם הירך."}, {"id": 181, "s": 83, "t": "terms", "q": "איזה זוג מונחים מתאר מיקום ביחס לפני השטח של הגוף?", "o": ["Superficial / Deep (שטחי / עמוק)", "Proximal / Distal (מקורב / מרוחק)", "Medial / Lateral (פנימי / צידי)", "Superior / Inferior (עליון / תחתון)"], "e": "שטחי ועמוק מתארים קרבה לפני השטח – לעור."}, {"id": 182, "s": 85, "t": "terms", "q": "הטבור נמצא ביחס לעמוד השדרה המותני:", "o": ["אנטריורי (Anterior)", "פוסטריורי (Posterior)", "סופריורי (Superior)", "לטרלי (Lateral)"], "e": "הטבור קרוב יותר לחזית הגוף – ולכן אנטריורי לעמוד השדרה."}, {"id": 183, "s": 87, "t": "terms", "q": "כל המשפטים הבאים נכונים, חוץ מ:", "o": ["המרפק דיסטלי לשורש כף היד", "הקרסול דיסטלי לשוקה", "הברך פרוקסימלית לקרסול", "הכתף פרוקסימלית למרפק"], "e": "המרפק קרוב יותר לחיבור הגפה לגוף – ולכן הוא פרוקסימלי (לא דיסטלי) לשורש כף היד."}, {"id": 184, "s": 86, "t": "terms", "q": "כל המשפטים הבאים נכונים, חוץ מ:", "o": ["עצם הבריח לטרלית לכתף", "האגודל לטרלי לזרת", "האף מדיאלי לעיניים", "האוזן לטרלית לעין"], "e": "לפי המצגת, עצם הבריח מדיאלית לכתף (קרובה יותר לקו האמצע) – לא לטרלית."}, {"id": 185, "s": 90, "t": "spine", "q": "לאילו שני חלקים נחלק השלד?", "o": ["שלד צירי (Axial) ושלד היקפי (Appendicular)", "שלד עליון (Upper) ושלד תחתון (Lower)", "שלד קדמי (Anterior) ושלד אחורי (Posterior)", "שלד ארוך (Long) ושלד קצר (Short)"], "e": "השלד נחלק לשלד צירי (Axial) ולשלד היקפי (Appendicular)."}, {"id": 186, "s": 93, "t": "spine", "q": "כל הבאים שייכים לשלד הצירי (Axial skeleton), חוץ מ:", "o": ["עצם הבריח (Clavicle)", "הגולגולת (Skull)", "עמוד השדרה (Vertebral column)", "עצם החזה (Sternum)"], "e": "השלד הצירי: גולגולת, עמוד השדרה, צלעות ועצם החזה. עצם הבריח שייכת לחגורת הכתפיים – שלד היקפי."}, {"id": 187, "s": 93, "t": "spine", "q": "הצלעות (Ribs) שייכות ל:", "o": ["שלד צירי (Axial skeleton)", "שלד היקפי (Appendicular skeleton)", "חגורת הכתפיים", "גפה עליונה"], "e": "השלד הצירי כולל גולגולת, עמוד שדרה, צלעות ועצם החזה."}, {"id": 188, "s": 91, "t": "spine", "q": "מהו \"פורמן\" (Foramen) בעצם?", "o": ["חור", "בליטה", "שקע", "זיז"], "e": "Foramen = חור. Fossa = שקע, Process = זיז, Tubercle/Tuberosity/Trochanter = בליטה."}, {"id": 189, "s": 91, "t": "spine", "q": "מהי \"פוסה\" (Fossa) בעצם?", "o": ["שקע", "חור", "קוץ", "בליטה"], "e": "Fossa = שקע (למשל Supraspinous fossa בשכמה)."}, {"id": 190, "s": 91, "t": "spine", "q": "כל המונחים הבאים מתארים בליטה בעצם, חוץ מ:", "o": ["Foramen", "Tubercle", "Tuberosity", "Trochanter"], "e": "Tubercle, Tuberosity ו-Trochanter הם בליטות. Foramen הוא חור."}, {"id": 191, "s": 91, "t": "spine", "q": "\"Process\" במונחי השלד הוא:", "o": ["זיז", "שקע", "חור", "מפרק"], "e": "Process = זיז (כמו Spinous process – הזיז האחורי של החוליה)."}, {"id": 192, "s": 94, "t": "spine", "q": "כל הבאים הם תפקידי עמוד השדרה, חוץ מ:", "o": ["ייצור נוזל סינוביאלי לכל מפרקי הגוף", "נשיאת משקל הגוף", "הגנה על חוט השדרה", "מתן אפשרות לתנועה"], "e": "עמוד השדרה הוא ציר הגוף – נושא את המשקל, מגן על חוט השדרה ומאפשר תנועה."}, {"id": 193, "s": 95, "t": "spine", "q": "מכמה חוליות מורכב עמוד השדרה ל ine", "q": "מה מאפיין את החוליות המותניות (Lumbar vertebrae)?", "o": ["גוף חוליה גדול במיוחד שנושא את רוב המשקל", "חוליה ללא גוף כלל – טבעת בלבד", "נקב בזיזים הרוחביים שבו עובר עורק", "מפרק עם זוג צלעות – מימין ומשמאל"], "e": "גוף החוליה המותנית גדול במיוחד, והן נושאות את רוב משקל עמוד השדרה."}, {"id": 226, "s": 107, "t": "spine", "q": "מדוע לחוליות המותניות יש גוף גדול במיוחד?", "o": ["כי הן נושאות את רוב משקל עמוד השדרה", "כי הן נושאות את הגולגולת", "כי הן מחוברות לצלעות", "כי חוט השדרה רחב שם"], "e": "החוליות המותניות נושאות את רוב משקל עמוד השדרה – ולכן גופן גדול."}, {"id": 227, "s": 95, "t": "spine", "q": "כל ההתאמות הבאות נכונות, חוץ מ:", "o": ["חוליות מותניות – 7", "חוליות צוואריות – 7", "חוליות בית החזה – 12", "עצם הזנב – 4 חוליות"], "e": "יש 5 חוליות מותניות, לא 7."}, {"id": 228, "s": 108, "t": "spine", "q": "מהו החלק הפנימי של הדיסק הבין-חולייתי?", "o": ["Nucleus pulposus – חומר ג'לטיני רך", "Annulus fibrosus – סחוס סיבי בטבעות", "גוף החוליה", "סחוס היאליני"], "e": "החלק הפנימי – Nucleus pulposus – חומר ג'לטיני רך; החלק החיצוני – Annulus fibrosus – סחוס סיבי בטבעות."}, {"id": 229, "s": 109, "t": "spine", "q": "כל הבאים הם תפקידי הדיסק הבין-חולייתי, חוץ מ:", "o": ["הגנה על הלב והריאות", "בלימת זעזועים", "מתן אפשרות לתנועה בין החוליות", "הפחתת חיכוך בין החוליות"], "e": "תפקידי הדיסק: בולם זעזועים, מאפשר תנועה בין החוליות ומפחית חיכוך ביניהן."}, {"id": 230, "s": 108, "t": "spine", "q": "הדיסק הבין-חולייתי מתואר במצגת כ:", "o": ["חזק וגמיש בעת ובעונה אחת", "קשיח לחלוטין", "רך לחלוטין ללא חוזק", "עשוי עצם צפופה"], "e": "הדיסק יושב בין כל זוג חוליות – חזק וגמיש בעת ובעונה אחת."}, {"id": 231, "s": 110, "t": "spine", "q": "ממה בנוי כלוב בית החזה (Thoracic cage)?", "o": ["עצם החזה, 12 זוגות צלעות וחוליות בית החזה", "עצם הבריח, השכמה ו-12 זוגות צלעות", "12 זוגות צלעות בלבד, ללא עצמות נוספות", "עצם החזה, עצם הבריח וחוליות הצוואר"], "e": "מלפנים עצם החזה, בהיקף 12 זוגות צלעות ומאחור חוליות בית החזה."}, {"id": 232, "s": 110, "t": "spine", "q": "כמה זוגות צלעות יש בכלוב ium, Ischium, Pubis", "Femur, Tibia, Fibula", "Sacrum, Coccyx, Femur", "Ilium, Sacrum, Patella"], "e": "האגן (Pelvic girdle): Ilium, Ischium, Pubis."}, {"id": 241, "s": 114, "t": "app", "q": "מהי העצם היחידה בזרוע (בין הכתף למרפק)?", "o": ["Humerus – עצם הזרוע", "Radius", "Ulna", "Femur"], "e": "עצם הזרוע – Humerus."}, {"id": 242, "s": 114, "t": "app", "q": "איזו מעצמות האמה נמצאת בצד הלטרלי (בצד האגודל)?", "o": ["Radius – אמה לטרלית", "Ulna – אמה מדיאלית", "Humerus", "Clavicle"], "e": "הרדיוס הוא האמה הלטרלית (בצד האגודל), והאולנה היא האמה המדיאלית."}, {"id": 243, "s": 114, "t": "app", "q": "איזו מעצמות האמה נמצאת בצד המדיאלי (בצד הזרת)?", "o": ["Ulna – אמה מדיאלית", "Radius – אמה לטרלית", "Humerus", "Scapula"], "e": "האולנה היא האמה המדיאלית – בצד הזרת במנח אנטומי."}, {"id": 244, "s": 114, "t": "app", "q": "מה השם האנגלי של עצמות האצבעות?", "o": ["Phalanges", "Metacarpals", "Carpal bones", "Metatarsals"], "e": "אצבעות – Phalanges. מסרקים – Metacarpals. שורש כף היד – Carpal bones."}, {"id": 245, "s": 114, "t": "app", "q": "מהו הסדר הנכון של עצמות כף היד, מפרוקסימלי לדיסטלי?", "o": ["Carpal bones ← Metacarpals ← Phalanges", "Phalanges ← Metacarpals ← Carpal bones", "Metacarpals ← Carpal bones ← Phalanges", "Carpal bones ← Phalanges ← Metacarpals"], "e": "שורש כף היד (Carpals) ← מסרקים (Metacarpals) ← אצבעות (Phalanges)."}, {"id": 246, "s": 114, "t": "app", "q": "כל הבאות הן עצמות הגפה העליונה, חוץ מ:", "o": ["Fibula", "Radius", "Ulna", "Metacarpals"], "e": "Fibula (שוקית) היא עצם בגפה התחתונה."}, {"id": 247, "s": 117, "t": "app", "q": "מהו ה-Acromion?", "o": ["זיז בחלק העליון-לטרלי של השכמה", "חור בקצה הלטרלי של עצם הבריח", "שקע בראש עצם הירך", "בליטה על גוף החוליה"], "e": "ה-Acromion הוא זיז בקצה העליון-לטרלי של השכמה – נראה במבט האחורי של השכמה."}, {"id": 248, "s": 117, "t": "app", "q": "איך נקרא השקע בשכמה שמעל קוץ השכמה (Spine of scapula)?", "o": ["Supraspinous fossa", "Infraspinous fossa", "Subscapular fossa", "Glenoid cavity"], "e": "Supra = מעל. השקע שמעל קוץ השכמה הוא Supraspinous fossa; מתחתיו – Infraspinous fossa."}, {"id": 249, "s": 117, "t": "app", "q": "איך נקרא השקע בשכמה שמתחת לקוץ השכמה, במבט אחורי?", "o": ["Infraspinous fossa", "Supraspinous fossa", "Subscapular fossa", "Acetabulum"], "e": "Infra = מתחת. Infraspinous fossa נמצא מתחת לקוץ השכמה."}, {"id": 250, "s": 118, "t": "app", "q": "איזה שקע נמצא במשטח הקדמי של השכמה?", "o": ["Subscapular fossa", "Infraspinous fossa", "Supraspinous fossa", "Acetabulum"], "e": "Subscapular fossa – השקע במשטח הקדמי של השכמה (הפונה לצלעות)."}, {"id": 251, "s": 122, "t": "app", "q": "השקע בשכמה שאליו מתחבר ראש עצם הזרוע נקרא:", "o": ["Glenoid fossa / cavity", "Acetabulum", "Subscapular fossa", "Coracoid process"], "e": "המפגש בין ראש הזרוע לשקע השכמה – Glenoid fossa – יוצר את מפרק הכתף."}, {"id": 252, "s": 122, "t": "app", "q": "איזה מפרק רואים בתמונה?", "o": ["מפרק הכתף – ראש הזרוע והמשטח הגלנואידי", "מפרק הירך – ראש הירך והאצטבולום", "מפרק המרפק", "מפרק הברך"], "e": "בתמונה רואים את ראש עצם הזרוע (Head of humerus) מול שקע השכמה (Glenoid fossa).", "img": "q122"}, {"id": 253, "s": 117, "t": "app", "q": "כל הבאים הם חלקים של השכמה (Scapula), חוץ מ:", "o": ["Dens", "Acromion", "Coracoid process", "Inferior angle"], "e": "Dens הוא הזיז של החוליה C2 (Axis), לא חלק מהשכמה."}, {"id": 254, "s": 119, "t": "app", "q": "הקצה המדיאלי של עצם הבריח (Clavicle) נקרא:", "o": ["Sternal end – הקצה החזי", "Acromial end – הקצה האקרומיאלי", "Coracoid process", "Conoid tubercle"], "e": "הקצה המדיאלי – Sternal end (מתחבר לעצם החזה); הקצה הלטרלי – Acromial end."}, {"id": 255, "s": 119, "t": "app", "q": "הקצה הלטרלי של עצם הבריח (Clavicle) מתחבר ל:", "o": ["Acromion של השכמה", "עצם החזה (Sternum)", "הצלע הראשונה", "ראש עצם הזרוע"], "e": "הקצה הלטרלי נקרא Acromial end – כי הוא מתחבר ל-Acromion של השכמה."}, {"id": 256, "s": 123, "t": "app", "q": "אילו שלוש עצמות יוצרות את מפרק המרפק?", "o": ["Humerus, Radius, Ulna", "Humerus, Scapula, Clavicle", "Radius, Ulna, Carpal bones", "Femur, Tibia, Fibula"], "e" ט השדרה (Spinal cord)"], "e": "3 = עמוד השדרה (Vertebral column) – העמוד הבנוי מחוליות. שימי לב: חוט השדרה הוא העצב שעובר בתוכו.", "img": "v93"}, {"id": 291, "s": 127, "t": "vocab", "q": "בתמונת האגן – מה מסמן המספר 1 (\"כנף\" האגן העליונה)?", "o": ["Ilium – עצם הכסל", "Ischium – עצם השת", "Pubis – עצם החיק", "Sacrum – עצם העצה"], "e": "1 = Ilium – החלק הרחב והעליון של האגן (\"הכנפיים\" שמרגישים במותניים).", "img": "v127"}, {"id": 292, "s": 127, "t": "vocab", "q": "בתמונת האגן – מה מסמן המספר 2?", "o": ["Sacrum – עצם העצה", "Ilium – עצם הכסל", "Coccyx – עצם הזנב", "Pubis – עצם החיק"], "e": "2 = Sacrum – עצם העצה, 5 חוליות שהתאחו, יושבת בין שני חצאי האגן מאחור.", "img": "v127"}, {"id": 293, "s": 127, "t": "vocab", "q": "בתמונת האגן – מה מסמן המספר 3 (החלק הקדמי-אמצעי)?", "o": ["Pubis – עצם החיק", "Ischium – עצם השת", "Ilium – עצם הכסל", "Sacrum – עצם העצה"], "e": "3 = Pubis – החלק הקדמי של האגן. שני חלקי ה-Pubis נפגשים ב-Symphysis pubis.", "img": "v127"}, {"id": 294, "s": 127, "t": "vocab", "q": "בתמונת האגן – מה מסמן המספר 4 (החלק התחתון)?", "o": ["Ischium – עצם השת", "Pubis – עצם החיק", "Ilium – עצם הכסל", "Coccyx – עצם הזנב"], "e": "4 = Ischium – החלק התחתון-אחורי של האגן, העצם שעליה יושבים.", "img": "v127"}, {"id": 295, "s": 117, "t": "vocab", "q": "בתמונת השכמה (מבט אחורי) – מה מסמן המספר 1?", "o": ["Acromion", "Glenoid cavity", "Spine of scapula", "Supraspinous fossa"], "e": "1 = Acromion – הזיז בקצה העליון-לטרלי של השכמה, מתחבר לעצם הבריח.", "img": "v117"}, {"id": 296, "s": 117, "t": "vocab", "q": "בתמונת השכמה – מה מסמן המספר 2?", "o": ["Supraspinous fossa", "Infraspinous fossa", "Subscapular fossa", "Glenoid cavity"], "e": "2 = Supraspinous fossa – Supra = מעל: השקע שמעל קוץ השכמה.", "img": "v117"}, {"id": 297, "s": 117, "t": "vocab", "q": "בתמונת השכמה – מה מסמן המספר 3?", "o": ["Spine of scapula – קוץ השכמה", "Acromion", "Infraspinous fossa", "Glenoid cavity"], "e": "3 = Spine of scapula – הרכס האלכסוני שחוצה את גב השכמה.", "img": "v117"}, {"id": 298, "s": 117, "t": "vocab", "q": "בתמונת השכמה – מה מסמן המספר 4?", "o": ["Glenoid cavity – השקע של מפרק הכתף", "Acromion", "Supraspinous fossa", "Acetabulum"], "e": "4 = Glenoid cavity – השקע שאליו מתחבר ראש עצם הזרוע.", "img": "v117"}, {"id": 299, "s": 117, "t": "vocab", "q": "בתמונת השכמה – מה מסמן המספר 5?", "o": ["Infraspinous fossa", "Supraspinous fossa", "Subscapular fossa", "Spine of scapula"], "e": "5 = Infraspinous fossa – Infra = מתחת: השקע שמתחת לקוץ השכמה.", "img": "v117"}, {"id": 300, "s": 126, "t": "vocab", "q": "מה השם העברי של ה-Femur?", "o": ["עצם הירך", "עצם הזרוע", "השוקה", "פיקת הברך"], "e": "Femur = ירך. טיפ: Femur ו-Humerus שתיהן העצם הגדולה \"העליונה\" בגפה – Femur ברגל, Humerus ביד."}, {"id": 301, "s": 114, "t": "vocab", "q": "מה השם העברי של ה-Humerus?", "o": ["עצם הזרוע", "עצם הירך", "עצם הבריח", "השכמה"], "e": "Humerus = זרוע – העצם בין הכתף למרפק."}, {"id": 302, "s": 114, "t": "vocab", "q": "מה השם העברי של ה-Clavicle?", "o": ["עצם הבריח", "השכמה", "עצם החזה", "הצלע הראשונה"], "e": "Clavicle = עצם הבריח. (Clavis בלטינית = מפתח – העצם דומה למפתח עתיק.)"}, {"id": 303, "s": 114, "t": "vocab", "q": "מה השם העברי של ה-Scapula?", "o": ["השכמה", "עצם הבריח", "עצם החזה", "האגן"], "e": "Scapula = שכמה – עצם שטוחה ומשולשת בגב."}, {"id": 304, "s": 93, "t": "vocab", "q": "מה השם העברי של ה-Sternum?", "o": ["עצם החזה", "עצם הבריח", "כלוב הצלעות", "השכמה"], "e": "Sternum = עצם החזה – במרכז החזה, אליה מתחברות הצלעות."}, {"id": 305, "s": 126, "t": "vocab", "q": "מה השם העברי של ה-Patella?", "o": ["פיקת הברך", "עצם העקב", "שורש כף הרגל", "השוקית"], "e": "Patella = פיקה – העצם הקטנה מול הברך."}, {"id": 306, "s": 95, "t": "vocab", "q": "מה השם העברי של ה-Sacrum?", "o": ["עצם העצה", "עצם הזנב", "עצם הכסל", "עצם השת"], "e": "Sacrum = עצה – 5 חוליות שהתאחו בתחתית עמוד השדרה."}, {"id": 307, "s": 95, "t": "vocab", "q": "מה השם העברי של ה-Coccyx?", "o": ["עצם הזנב", "עצם העצה", "עצם החיק", "עצם השת"], "e": "Coccyx = זנב – 4 חוליות קטנות בקצה התחתון של עמוד השדרה."}, {"id": 308, "s": 95, "t": "vocab", "q": "מה פירוש המילה Vertebra?", "o": ["חוליה", "צלע", "דיסק", "חוט השדרה"], "e": "Vertebra = חוליה; ברבים Vertebrae. Vertebral column = עמוד השדרה."}, {"id": 309, "s": 93, "t": "vocab", "q": "מה פירוש המילה Ribs?", "o": ["צלעות", "חוליות", "עצמות החזה", "שכמות"], "e": "Ribs = צלעות. Costal (מלטינית Costa) הוא שם התואר – למשל Costal cartilage = סחוס הצלעות."}, {"id": 310, "s": 93, "t": "vocab", "q": "איך אומרים \"גולגולת\" באנגלית?", "o": ["Skull", "Spine", "Sternum", "Sacrum"], "e": "גולגולת = Skull (בלשון מקצועית גם Cranium)."}, {"id": 311, "s": 126, "t": "vocab", "q": "איך אומרים \"שוקה\" באנגלית?", "o": ["Tibia", "Fibula", "Femur", "Talus"], "e": "שוקה = Tibia – העצם העבה של השוק."}, {"id": 312, "s": 114, "t": "vocab", "q": "איך אומרים \"שכמה\" באנגלית?", "o": ["Scapula", "Clavicle", "Sternum", "Patella"], "e": "שכמה = Scapula."}, {"id": 313, "s": 114, "t": "vocab", "q": "איך אומרים \"עצם הבריח\" באנגלית?", "o": ["Clavicle", "Scapula", "Sternum", "Humerus"], "e": "עצם הבריח = Clavicle."}, {"id": 314, "s": 126, "t": "vocab", "q": "איך אומרים \"עצם הירך\" באנגלית?", "o": ["Femur", "Humerus", "Fibula", "Coxa"], "e": "ירך = Femur."}, {"id": 315, "s": 114, "t": "vocab", "q": "Radius ו-Ulna הן שתי העצמות של:", "o": ["האמה (בין המרפק לשורש כף היד)", "השוק (בין הברך לקרסול)", "הזרוע (בין הכתף למרפק)", "כף היד"], "e": "האמה בנויה משתי עצמות: Radius (לטרלית, צד האגודל) ו-Ulna (מדיאלית, צד הזרת)."}, {"id": 316, "s": 114, "t": "vocab", "q": "Radius נמצאת בצד ה___ של האמה, ו-Ulna בצד ה___:", "o": ["אגודל ; זרת", "זרת ; אגודל", "אחורי ; קדמי", "עליון ; תחתון"], "e": "טיפ: Radius \"מסתובבת\" כמו רדיוס של גלגל – והיא בצד האגודל. Ulna בצד הזרת."}, {"id": 317, "s": 126, "t": "vocab", "q": "Tibia ו-Fibula הן שתי העצמות של:", "o": ["השוק (בין הברך לקרסול)", "האמה (בין המרפק לשורש כף היד)", "הירך", "כף הרגל"], "e": "השוק בנויה משתי עצמות: Tibia (שוקה, עבה) ו-Fibula (שוקית, דקה)."}, {"id": 318, "s": 114, "t": "vocab", "q": "Carpal bones הן עצמות:", "o": ["שורש כף היד", "שורש כף הרגל", "האצבעות", "האמה"], "e": "Carpal = שורש כף היד (ביד). Tarsal = שורש כף הרגל (ברגל). טיפ: Car – \"נוהגים\" עם הידיים."}, {"id": 319, "s": 126, "t": "vocab", "q": "Tarsal bones הן עצמות:", "o": ["שורש כף הרגל", "שורש כף היד", "מסרק כף הרגל", "האצבעות"], "e": "Tarsal = שורש כף הרגל. המקבילה ביד: Carpal."}, {"id": 320, "s": 114, "t": "vocab", "q": "מה ההבדל בין Metacarpals ל-Metatarsals?", "o": ["Metacarpals ביד, Metatarsals ברגל", "Metacarpals ברגל, Metatarsals ביד", "שתיהן ביד", "שתיהן עצמות אצבעות"], "e": "Meta = \"אחרי\": Metacarpals באות אחרי ה-Carpals (ביד), Metatarsals אחרי ה-Tarsals (ברגל)."}, {"id": 321, "s": 114, "t": "vocab", "q": "Phalanges הן:", "o": ["עצמות האצבעות – גם ביד וגם ברגל", "עצמות האצבעות ביד בלבד", "עצמות שורש כף היד", "עצמות המסרק"], "e": "Phalanges = עצמות האצבעות. אותו שם ביד וברגל."}, {"id": 322, "s": 113, "t": "vocab", "q": "Coxa הוא שם נוסף ל:", "o": ["אגן (Pelvic girdle)", "חגורת הכתפיים", "עצם הירך", "עצם העצה"], "e": "Coxa = האגן. בנוי מ-Ilium, Ischium ו-Pubis."}, {"id": 323, "s": 132, "t": "vocab", "q": "מה השם של עצם הקרסול שנפגשת עם ה-Tibia וה-Fibula?", "o": ["Talus", "Patella", "Coxa", "Sacrum"], "e": "Talus = עצם הקרסול. מפרק הקרסול = Tibia + Fibula + Talus."}, {"id": 324, "s": 113, "t": "vocab", "q": "\"Shoulder girdle\" פירושו:", "o": ["חגורת הכתפיים", "מפרק הכתף", "חגורת האגן", "כלוב הצלעות"], "e": "Girdle = חגורה. Shoulder girdle = חגורת הכתפיים (Clavicle + Scapula); Pelvic girdle = חגורת האגן."}, {"id": 325, "s": 113, "t": "vocab", "q": "\"Upper limb\" ו-\"Lower limb\" פירושם:", "o": ["גפה עליונה וגפה תחתונה", "פלג גוף עליון ותחתון", "עמוד שדרה עליון ותחתון", "זרוע ואמה"], "e": "Limb = גפה. Upper limb = יד (גפה עליונה), Lower limb = רגל (גפה תחתונה)."}, {"id": 326, "s": 90, "t": "vocab", "q": "\"Axial\" ו-\"Appendicular\" פירושם:", "o": ["צירי והיקפי (של הגפיים)", "קדמי ואחורי", "עליון ותחתון", "שטחי ועמוק"], "e": "Axial = צירי – מה שעל ציר הגוף (גולגולת, עמוד שדרה, צלעות, עצם החזה). Appendicular = היקפי – הגפיים והחגורות."}, {"id": 327, "s": 95, "t": "vocab", "q": "המילה Cervical מתייחסת ל:", "o": ["צוואר", "בית החזה", "מותניים", "עצם העצה"], "e": "Cervical = צווארי. 7 חוליות צוואריות (C1–C7)."}, {"id": 328, "s": 95, "t": "vocab", "q": "המילה Thoracic מתייחסת ל:", "o": ["בית החזה", "צוואר", "מותניים", "אגן"], "e": "Thoracic = של בית החזה (Thorax). 12 חוליות (T1–T12)."}, {"id": 329, "s": 95, "t": "vocab", "q": "המילה Lumbar מתייחסת ל:", "o": ["מותניים (הגב התחתון)", "צוואר", "בית החזה", "עצם הזנב"], "e": "Lumbar = מותני. 5 חוליות (L1–L5)."}, {"id": 330, "s": 95, "t": "vocab", "q": "האות L בשם החוליה \"L4\" מציינת:", "o": ["Lumbar – חוליה מותנית", "Lateral – לטרלית", "Lower – תחתונה", "Ligament – רצועה"], "e": "C = Cervical, T = Thoracic, L = Lumbar, S = Sacral. L4 = החוליה המותנית הרביעית."}, {"id": 331, "s": 54, "t": "vocab", "q": "התחילית Osteo- (כמו ב-Osteoblast) פירושה:", "o": ["עצם", "סחוס", "שריר", "עצב"], "e": "Osteo = עצם. Osteoblast, Osteoclast, Osteocyte – כולם תאי עצם."}, {"id": 332, "s": 38, "t": "vocab", "q": "התחילית Chondro- (כמו ב-Chondrocyte) פירושה:", "o": ["סחוס", "עצם", "שריר", "סיב"], "e": "Chondro = סחוס. Chondrocyte = תא סחוס."}, {"id": 333, "s": 71, "t": "vocab", "q": "התחילית Myo- (כמו ב-Myofibril, Myosin) פירושה:", "o": ["שריר", "עצב", "עצם", "דם"], "e": "Myo = שריר. Myofibril = סיבון שריר, Myosin = חלבון בשריר."}, {"id": 334, "s": 25, "t": "vocab", "q": "התחילית Neuro- (כמו ב-Neuron) פירושה:", "o": ["עצב", "שריר", "עצם", "תא"], "e": "Neuro = עצב. Neuron = תא עצב."}, {"id": 335, "s": 29, "t": "vocab", "q": "התחילית Fibro- (כמו ב-Fibroblast, Fibrocartilage) פירושה:", "o": ["סיב", "שומן", "עצם", "נוזל"], "e": "Fibro = סיב. Fibroblast = תא שבונה סיבים; Fibrocartilage = סחוס סיבי."}, {"id": 336, "s": 54, "t": "vocab", "q": "הסיומת -blast (כמו ב-Osteoblast) פירושה:", "o": ["בונה / מייצר", "מפרק", "תא בוגר", "סיב"], "e": "‎-blast = בונה. Osteoblast בונה עצם, Fibroblast בונה סיבים. טיפ: B = Build."}, {"id": 337, "s": 54, "t": "vocab", "q": "הסיומת -clast (כמו ב-Osteoclast) פירושה:", "o": ["מפרק / שובר", "בונה", "תא בוגר", "קרום"], "e": "‎-clast = מפרק. Osteoclast מפרק עצם. טיפ: C = Cut / Crush."}, {"id": 338, "s": 54, "t": "vocab", "q": "הסיומת -cyte (כמו ב-Osteocyte, Chondrocyte) פירושה:", "o": ["תא (בוגר)", "בונה", "מפרק", "רקמה"], "e": "‎-cyte = תא. Osteocyte = תא עצם בוגר, Chondrocyte = תא סחוס."}, {"id": 339, "s": 117, "t": "vocab", "q": "התחילית Supra- (כמו ב-Supraspinous) פירושה:", "o": ["מעל", "מתחת", "בין", "בתוך"], "e": "Supra = מעל. Supraspinous fossa = השקע שמעל קוץ השכמה."}, {"id": 340, "s": 117, "t": "vocab", "q": "התחילית Infra- (כמו ב-Infraspinous) פירושה:", "o": ["מתחת", "מעל", "סביב", "לפני"], "e": "Infra = מתחת. Infraspinous fossa = השקע שמתחת לקוץ השכמה."}, {"id": 341, "s": 111, "t": "vocab", "q": "התחילית Inter- (כמו ב-Intervertebral, Intercostal) פירושה:", "o": ["בין", "בתוך", "מעל", "מתחת"], "e": "Inter = בין. Intervertebral = בין החוליות, Intercostal = בין הצלעות."}, {"id": 342, "s": 111, "t": "vocab", "q": "Intercostal muscles הם שרירים ש:", "o": ["נמצאים בין הצלעות", "נמצאים בתוך החוליות", "עוטפים את הלב", "מחברים את השכמה לזרוע"], "e": "Inter = בין, Costa = צלע. השרירים הבין-צלעיים."}, {"id": 343, "s": 118, "t": "vocab", "q": "התחילית Sub- (כמו ב-Subscapular) פירושה:", "o": ["מתחת", "מעל", "בין", "מסביב"], "e": "Sub = מתחת. Subscapular fossa = השקע במשטח הקדמי של השכמה (\"מתחת\" לה, מול הצלעות)."}, {"id": 344, "s": 45, "t": "vocab", "q": "המילה Articular (כמו ב-Articular cartilage) פירושה:", "o": ["מפרקי – של המפרק", "סיבי", "גמיש", "עמוק"], "e": "Articular = מפרקי. Articular cartilage = הסחוס שמצפה את קצות העצמות במפרק."}, {"id": 345, "s": 34, "t": "vocab", "q": "המילה Synovial (כמו ב-Synovial fluid) קשורה ל:", "o": ["נוזל הסיכה של המפרק", "תאי העצם", "סיבי השריר", "מערכת העצבים"], "e": "Synovial fluid = הנוזל הסינוביאלי – נוזל סיכה שמפריש הקרום הפנימי של הקפסולה."}, {"id": 346, "s": 91, "t": "vocab", "q": "Foramen, Fossa ו-Process פירושם בהתאמה:", "o": ["חור, שקע, זי /* ---------- state & storage ---------- */
const LS_KEY="anat-quiz-v1";
function blank(){return {v:1,pts:0,total:0,correct:0,bestRun:0,bestDays:0,days:[],sessions:[],ans:{},badges:[],updated:0}}
let S = blank();
try{const raw=localStorage.getItem(LS_KEY); if(raw) S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
let db=null, progRef=null, saving=false, dirty=false;
function persist(){
  S.updated=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  if(progRef){dirty=true; flush();}
}
async function flush(){
  if(saving||!dirty||!progRef) return;
  saving=true; dirty=false;
  try{await progRef.set(JSON.parse(JSON.stringify(S)));}catch(e){ if(e&&e.code==="unavailable"){dirty=true; setTimeout(()=>{saving=false;flush();},1500+Math.random()*1000); return;} progRef=null; }
  saving=false; if(dirty) flush();
}
function merge(a,b){ // combine two progress states
  const base = (a.updated>=b.updated)?a:b, other = base===a?b:a;
  const out = JSON.parse(JSON.stringify(base));
  for(const [id,r] of Object.entries(other.ans||{})){ if(!out.ans[id]||out.ans[id].t<r.t) out.ans[id]=r; }
  out.days=[...new Set([...(base.days||[]),...(other.days||[])])].sort();
  out.badges=[...new Set([...(base.badges||[]),...(other.badges||[])])];
  out.bestRun=Math.max(base.bestRun||0,other.bestRun||0);
  out.bestDays=Math.max(base.bestDays||0,other.bestDays||0);
  return out;
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; const ref=db.doc("data/users/"+id+"/progress");
    const snap=await ref.get();
    if(snap.exists){ S=merge(S,Object.assign(blank(),snap.data())); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
    progRef=ref;
    if(!snap.exists && S.total>0){dirty=true; flush();}
    if(view==="home"||view==="dash") render();
    paintTop();
  }catch(e){ progRef=null; }
})();

  const set=new Set(S.days); let n=0; const d=new Date();
  if(!set.has(today())) d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}
  return n;
}
function topicStats(t){
  const qs=QUESTIONS.filter(q=>q.t===t); let seen=0,know=0;
  for(const q of qs){const r=S.ans[q.id]; if(r){seen++; if(r.last) know++;}}
  return {n:qs.length,seen,know,mastery:qs.length?know/qs.length:0};
}
function mistakes(){return QUESTIONS.filter(q=>S.ans[q.id]&&!S.ans[q.id].last)}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function paintTop(){$("#ptsN").textContent=S.pts.toLocaleString("he-IL");$("#dayN").textContent=dayStreak();}

/* ---------- session ---------- */
let view="home", sess=null;
function pick(pool){
  const unseen=shuffle(pool.filter(q=>!S.ans[q.id])).sort((a,b)=>(b.t==="vocab")-(a.t==="vocab"));
  if(unseen.length>=SESSION_LEN) return unseen.slice(0,SESSION_LEN);
  const seen=shuffle(pool.filter(q=>S.ans[q.id])).sort((a,b)=>{const ra=S.ans[a.id],rb=S.ans[b.id];return (ra.last-rb.last)||(ra.t-rb.t)});
  return shuffle(unseen.concat(seen.slice(0,SESSION_LEN-unseen.length)));
}
function start(mode,topic){
  let pool=QUESTIONS, label="תרגול חדש";
  if(mode==="mistakes"){pool=mistakes(); label="תרגול טעויות";}
  if(mode==="topic"){pool=QUESTIONS.filter(q=>q.t===topic); label=TOPICS[topic];}
  if(mode==="full"){pool=QUESTIONS.filter(q=>q.t===topic); label="כל השאלות · "+TOPICS[topic];}
  const qs=mode==="mistakes"?shuffle(pool).slice(0,SESSION_LEN):mode==="full"?shuffle(pool):pick(pool);
  if(!qs.length){toast("אין שאלות לתרגול כאן");return}
  sess={mode,label,qs:qs.map(q=>({id:q.id,order:shuffle([0,1,2,3]),chosen:null,ok:null,gain:0})),i:0,run:0,gained:0,topic};
  view="quiz"; render(); window.scrollTo(0,0);
}
function answer(k){
  const it=sess.qs[sess.i]; if(it.chosen!==null) return;
  const q=QMAP[it.id], orig=it.order[k], ok=orig===0;
  it.chosen=k; it.ok=ok;
  let gain=0;
  if(ok){sess.run++; gain=10+(sess.run>=5?10:sess.run>=3?5:0);} else sess.run=0;
  it.gain=gain; sess.gained+=gain;
  const prev=S.ans[q.id]||{c:0,w:0};
  S.ans[q.id]={c:prev.c+(ok?1:0),w:prev.w+(ok?0:1),last:ok?1:0,t:Date.now()};
  S.total++; if(ok) S.correct++; S.pts+=gain;
  S.curRun=ok?(S.curRun||0)+1:0; S.bestRun=Math.max(S.bestRun,S.curRun);
  if(!S.days.includes(today())) S.days.push(today());
  S.bestDays=Math.max(S.bestDays,dayStreak());
  persist(); paintTop(); render();
}
function next(){
  if(sess.i<sess.qs.length-1){sess.i++; render(); window.scrollTo(0,0); return}
  const c=sess.qs.filter(x=>x.ok).length, n=sess.qs.length;
  let bonus=0; if(c===n&&n>=SESSION_LEN){bonus=20; S.pts+=bonus; sess.gained+=bonus;}
  sess.bonus=bonus;
  S.sessions.push({d:Date.now(),c,n,p:sess.gained,m:sess.mode});
  if(S.sessions.length>200) S.sessions=S.sessions.slice(-200);
  sess.newBadges=BADGES.filter(b=>!S.badges.includes(b.id)&&b.ok(S)).map(b=>b.id);
  S.badges.push(...sess.newBadges);
  persist(); paintTop(); view="result"; render(); window.scrollTo(0,0);
}

/* ---------- views ---------- */
function render(){
  const el=$("#app");
  if(view==="home") el.innerHTML=homeView();
  else if(view==="quiz") el.innerHTML=quizView();
  else if(view==="result") el.innerHTML=resultView();
  else if(view==="dash") el.innerHTML=dashView();
  else if(view==="tpick") el.innerHTML=tpickView();
  else if(view==="bank"){ el.innerHTML=bankView(); paintBank(); }
}
function topicRows(){
  return TOPIC_ORDER.map(t=>{const s=topicStats(t);const m=Math.round(s.mastery*100);

}

  </div>`;
}
function vocabCard(){
  const v=topicStats("vocab"); if(v.seen>=v.n) return "";
  return `<section class="card start">

    <div class="row2"><button class="btn primary" type="button" data-act="topic" data-t="vocab">תרגול מונחים <small>· 10</small></button><button class="btn" type="button" data-act="full" data-t="vocab">כל ${v.n} המונחים</button></div>

}

}
function paintBank(){
  const list=bankFilter();
  $("#bankCount").textContent=`${list.length} שאלות`;
  $("#bankList").innerHTML=list.map(q=>{
    const r=S.ans[q.id], st=!r?`<span class="st">טרם נענתה</span>`:r.last?`<span class="st ok">נענתה נכון</span>`:`<span class="st no">טעות בפעם האחרונה</span>`;
    return `<article class="card bq">

}
function quizView(){
  const it=sess.qs[sess.i], q=QMAP[it.id], done=it.chosen!==null;
  const nOk=sess.qs.filter(x=>x.ok===true).length, nNo=sess.qs.filter(x=>x.ok===false).length, N=sess.qs.length;
  const dots=N>20?`<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${nOk+nNo}"><i class="ok" style="width:${nOk/N*100}%"></i><i class="no" style="width:${nNo/N*100}%"></i></div>`:sess.qs.map((x,i)=>`<i class="${x.ok===true?"ok":x.ok===false?"no":i===sess.i?"cur":""}"></i>`).join("");
  const opts=it.order.map((oi,k)=>{
    let cls=""; if(done){ if(oi===0) cls="right"; else if(k===it.chosen) cls="wrong"; else cls="dim"; }
    return `<button class="opt ${cls}" type="button" data-act="ans" data-k="${k}" ${done?"disabled":""}><span class="l">${LETTERS[k]}</span><span class="t">${esc(q.o[oi])}</span></button>`}).join("");
  let fb="";
  if(done){
    const ok=it.ok, gainTxt=ok?`+${it.gain}${it.gain>10?" · בונוס רצף":""}`:"";
    fb=`<section class="fb ${ok?"ok":"no"} pop" aria-live="polite">
      <h3>${ok?"נכון!":"לא נכון"} ${ok?`<span class="gain">${gainTxt}</span>`:""}</h3>

      <p>${esc(q.e)}</p>
      <div class="ref"><span>${ok?"מקור":"לחזרה על החומר"}: <b>שקופית ${q.s}</b></span><button class="linkbtn" type="button" data-act="slide">${ok?"הצגת השקופית":"הסתרת השקופית"}</button></div>
      <div class="slide" id="slideBox" ${ok?"hidden":""}><img src="s/${q.s}.jpg" alt="שקופית ${q.s} מהמצגת" loading="lazy"></div>
    </section>
    <button class="btn primary" type="button" data-act="next">${sess.i<sess.qs.length-1?"לשאלה הבאה":"לסיכום התרגול"}</button>`;
  }
  return `<div class="qhead"><span class="count">${sess.i+1}/${sess.qs.length}</span>${N>20?dots:`<div class="dots">${dots}</div>`}<button class="xbtn" type="button" data-act="quit">יציאה</button></div>
  <div class="stack">

      <span class="tag">${esc(TOPICS[q.t])}</span>${sess.run>=3?` <span class="tag" style="color:var(--gold);background:var(--gold-soft)">רצף ${sess.run}</span>`:""}
      <p class="qtext">${esc(q.q)}</p>
      ${q.img?`<div class="qimg"><img src="img/${q.img}.jpg" alt="תמונה לשאלה"></div>`:""}
    </section>
    <div class="opts">${opts}</div>

  </div>`;
}

function badgeHTML(b,isNew){const has=S.badges.includes(b.id);return `<div class="badge ${has?"":"lock"} ${isNew?"new":""}"><div class="ic">${ICON[b.ic]}</div><b>${esc(b.n)}</b><span class="muted">${esc(b.d)}</span></div>`}
function chart(){
  const ss=S.sessions.slice(-12); if(ss.length<2) return `<p class="muted">הגרף יופיע אחרי שני תרגולים לפחות.</p>`;
  const W=600,H=180,pl=34,pr=10,pt=12,pb=26, xs=i=>pl+(W-pl-pr)*(ss.length===1?0:i/(ss.length-1)), ys=v=>pt+(H-pt-pb)*(1-v);
  const pts=ss.map((s,i)=>[xs(i),ys(s.c/s.n)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${ys(0)} L${pts[0][0].toFixed(1)} ${ys(0)} Z`;
  const grid=[0,.5,1].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${ys(v)+4}" font-size="12" fill="var(--muted)" text-anchor="end">${v*100}%</text>`).join("");
  const last=pts[pts.length-1], lv=ss[ss.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="דיוק ב-${ss.length} התרגולים האחרונים" style="direction:ltr">${grid}

}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==="new") start("new");
  else if(a==="mistakes") start("mistakes");
  else if(a==="topic") start("topic",b.dataset.t);
  else if(a==="full") start("full",b.dataset.t);
  else if(a==="tpick"){pickT=b.dataset.t;view="tpick";render();window.scrollTo(0,0)}
  else if(a==="dash"){view="dash";render();window.scrollTo(0,0)}
  else if(a==="bank"){view="bank";render();window.scrollTo(0,0)}
  else if(a==="bt"){bankTopic=b.dataset.t;document.querySelectorAll(".fchip").forEach(x=>x.classList.toggle("on",x===b));paintBank();}
  else if(a==="bslide"){const box=b.nextElementSibling; if(!box.firstChild) box.innerHTML=`<img src="s/${b.dataset.s}.jpg" alt="שקופית ${b.dataset.s} מהמצגת" loading="lazy">`; box.hidden=!box.hidden; b.textContent=(box.hidden?"הצגת":"הסתרת")+" שקופית "+b.dataset.s;}
  else if(a==="home"){view="home";render();window.scrollTo(0,0)}
  else if(a==="ans") answer(+b.dataset.k);
  else if(a==="next") next();
  else if(a==="quit"){view="home";sess=null;render()}
  else if(a==="slide"){const box=$("#slideBox");box.hidden=!box.hidden;b.textContent=box.hidden?"הצגת השקופית":"הסתרת השקופית";}
});
document.addEventListener("input",e=>{
  if(e.target.id==="bankSearch"){bankQ=e.target.value;paintBank();}
  else if(e.target.id==="bankAns"){bankAns=e.target.checked;paintBank();}
});
$("#homeBtn").addEventListener("click",()=>{view="home";sess=null;render();});
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||!sess) return; const it=sess.qs[sess.i];
  if(it.chosen===null&&["1","2","3","4"].includes(e.key)) answer(+e.key-1);
  else if(it.chosen!==null&&e.key==="Enter"&&!e.target.closest("button")) next();
});
paintTop(); render();
</script>
</body>
</html>
